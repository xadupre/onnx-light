name: Build Release Wheels

on:
  workflow_dispatch:
  schedule:
    # Run every Monday at 06:00 UTC to catch toolchain/manylinux regressions early.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels_linux:
    name: wheels (linux, ${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect runner CPU count
        id: cpu_count
        shell: bash
        run: |
          count=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${count}"
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.2
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp313t-* cp314-* cp314t-*"
          CIBW_ARCHS: ${{ matrix.arch }}
          # The default cibuildwheel manylinux2014 image ships GCC 10, which
          # rejects some of our recursive container templates (e.g. the
          # n-gram trie in kernel_tf_idf_vectorizer.cc that stores an
          # ``std::unordered_map<Key, NgramNode>`` of itself). Use
          # manylinux_2_28 so we build with GCC 12 across all CPython
          # versions, matching the toolchain used by the regular CI build.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT: >
            CMAKE_BUILD_PARALLEL_LEVEL=${{ steps.cpu_count.outputs.count }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_wheels_windows:
    name: wheels (windows, ${{ matrix.arch }})
    needs: build_wheels_linux
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            runs-on: windows-latest
          - arch: x86
            runs-on: windows-latest
          - arch: ARM64
            runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect runner CPU count
        id: cpu_count
        shell: bash
        run: |
          count=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${count}"
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.2
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp313t-* cp314-* cp314t-*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT: >
            CMAKE_BUILD_PARALLEL_LEVEL=${{ steps.cpu_count.outputs.count }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_wheels_macos:
    name: wheels (macos, ${{ matrix.arch }})
    needs: build_wheels_linux
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs-on: macos-latest
          - arch: x86_64
            runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect runner CPU count
        id: cpu_count
        shell: bash
        run: |
          count=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${count}"
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.2
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp313t-* cp314-* cp314t-*"
          CIBW_ARCHS: ${{ matrix.arch }}
          # Disable the optional OpenSSL dependency on macOS: the Homebrew
          # ``openssl@3`` formula on recent runners ships a ``libcrypto.3.dylib``
          # whose minimum deployment target (>= macOS 15) is higher than the
          # ``macosx_11_0_*`` wheel tag cibuildwheel produces, which makes
          # ``delocate-wheel`` fail with ``Library dependencies do not satisfy
          # target MacOS version 11.0``. We keep the encrypted-model
          # save/load feature available on Linux/Windows where the toolchain
          # OpenSSL is compatible.
          CIBW_ENVIRONMENT: >
            CMAKE_BUILD_PARALLEL_LEVEL=${{ steps.cpu_count.outputs.count }}
            CMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
