[workspace]
name = "onnx-light"
description = "onnx without protobuf"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

# Environment providing the build/runtime/dev/docs dependencies declared in
# pyproject.toml. nanobind comes from PyPI until version 3 is available on
# conda-forge.
# After running `pixi install`, build/install the package itself with:
#     pixi run pip install --no-build-isolation -e .

[dependencies]
python = ">=3.12"
numpy = ">=2.2"
ml_dtypes = ">=0.5.0"
cmake = ">=3.27"
ninja = "*"
cxx-compiler = "*"
scikit-build-core = ">=0.3.3"
pip = "*"

[pypi-dependencies]
nanobind = ">=3.0.0"

[feature.dev-no-onnx.dependencies]
black = "==26.5.1"
clang-format = "==22.1.8"
coverage = "*"
matplotlib-base = "*"
mypy = "==2.3.0"
openpyxl = "*"
pandas = "*"
pyrefly = "==1.2.0"
ruff = "==0.16.2"

[feature.dev-onnx.dependencies]
onnx = ">=1.17"
onnxruntime = "*"

[feature.docs.dependencies]
black = "==26.5.1"
breathe = "*"
matplotlib-base = "*"
onnx = ">=1.17"
onnxruntime = "*"
openpyxl = "*"
pandas = "*"
pydata-sphinx-theme = "*"
sphinx = ">=7"
sphinx-copybutton = "*"
sphinx-design = "*"
sphinx-gallery = "*"
sphinx-issues = "*"
myst-parser = "*"
sphinxcontrib-mermaid = "*"

[environments]
default = { solve-group = "default" }
dev-no-onnx = { features = ["dev-no-onnx"], solve-group = "default" }
dev = { features = ["dev-no-onnx", "dev-onnx"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
