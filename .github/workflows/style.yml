name: Style

on:
  workflow_call:
  workflow_dispatch:

jobs:
  style:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install style tools
        run: pip install black==26.5.1 ruff==0.15.20
      - name: Check style
        run: black --check . && ruff check .
