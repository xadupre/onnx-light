name: ci-1-core

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect doc-only changes
        id: filter
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "${BASE_REF}" ]; then
            base_sha="${BASE_REF}"
          else
            base_sha="$(git rev-parse "${HEAD_REF}^" 2>/dev/null || echo '')"
          fi
          if [ -z "${base_sha}" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${base_sha}" "${HEAD_REF}")"
          echo "Changed files:"
          echo "${changed}"
          docs_only=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|*.md|*.rst) ;;
              *) docs_only=false ;;
            esac
          done <<< "${changed}"
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  reduced_tests_ubuntu:
    # Fastest preflight: builds onnx-light without the operator-kernel runtime
    # and backend-test registries (ONNX_LIGHT_BUILD_KERNELS=OFF). Runs in
    # parallel with the no-onnx preflight; both must pass before the heavier
    # compilation jobs start. Kernel/backend tests skip themselves via
    # onnx_light.ext_test_case.import_or_skip, so the suite exercises the proto /
    # schema / shape-inference / manipulation layers that ship in the reduced
    # build. Mirrors .github/workflows/build_reduced_wheel.yml's configure flags.
    name: reduced (ubuntu-latest, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install OpenSSL (Linux)
        run: sudo apt-get install -y libssl-dev

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      # sccache caches compiled objects in the GitHub Actions cache so repeated
      # runs that do not touch C++ sources are near-instant, matching the
      # macOS/Windows core builds that already use sccache.
      - name: Build and Install package without kernels/backend
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -C build-dir=build -C cmake.define.ONNX_LIGHT_BUILD_KERNELS=OFF -C cmake.define.ONNX_LIGHT_BUILD_TESTS=ON -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[dev] -v

      - name: pip freeze
        run: pip freeze

      - name: Run reduced C++ unit tests (Linux)
        run: ctest --test-dir build --output-on-failure

      - name: Run tests (kernel/backend tests skip themselves)
        run: |
          UNITTEST_GOING=1 pytest --durations=10 unittests --ignore=unittests/onnxl_vs_onnx --ignore=unittests/onnxl_vs_ort

  no_onnx_tests_ubuntu:
    # Fast preflight: must pass before the heavier compilation jobs start.
    # Runs in parallel with the reduced (no kernels/backend) build; both
    # preflights gate the downstream compilation jobs. Mirrors
    # .github/workflows/ci_no_onnx.yml but lives inside ci-1-core so the gate is
    # observable as a required PR status check.
    name: no-onnx (ubuntu-latest, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 19
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install OpenSSL (Linux)
        run: sudo apt-get install -y libssl-dev

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      # sccache caches compiled objects in the GitHub Actions cache so repeated
      # runs that do not touch C++ sources are near-instant, matching the
      # macOS/Windows core builds that already use sccache.
      - name: Build and Install package
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -Cbuild-dir=build -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[dev] -v

      - name: uninstall onnx
        run: pip uninstall -y onnx

      - name: pip freeze
        run: pip freeze

      - name: Run tests (excluding onnxl_vs_onnx and onnxl_vs_ort)
        run: |
          UNITTEST_GOING=1 pytest --durations=10 unittests --ignore=unittests/onnxl_vs_onnx --ignore=unittests/onnxl_vs_ort

  core_tests_ubuntu:
    name: core (ubuntu-latest, py3.13)
    needs: [reduced_tests_ubuntu, no_onnx_tests_ubuntu]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install OpenSSL (Linux)
        run: sudo apt-get install -y libssl-dev

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      # sccache caches compiled objects in the GitHub Actions cache so repeated
      # runs that do not touch C++ sources are near-instant, matching the
      # macOS/Windows core builds that already use sccache.
      - name: Build and Install package (Linux)
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -C build-dir=build -C cmake.build-type=Release -C cmake.define.ONNX_LIGHT_BUILD_TESTS=ON -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[dev] -v

      - name: Report installed lib_onnx_proto size
        run: |
          proto_dir="$(python -c 'import importlib.util, pathlib; print(pathlib.Path(importlib.util.find_spec("onnx_light.onnx_py._onnxpyprotoop").origin).parent)')"
          python .github/scripts/report_proto_binary_size.py \
            "${proto_dir}" \
            --summary "${GITHUB_STEP_SUMMARY}" \
            --max-installed-size 1258291

      - name: Install ONNX weekly
        run: pip uninstall -y onnx && pip install --upgrade onnx-weekly

      - name: pip freeze
        run: pip freeze

      - name: Run C++ unit tests (Linux)
        run: ctest --test-dir build --output-on-failure

      - name: Run tests
        run: |
          UNITTEST_GOING=1 pytest --durations=10 unittests

  core_tests:
    name: core (${{ matrix.os }}, py${{ matrix.python-version }})
    # Gated on both fast preflights (reduced + no-onnx) so the slow
    # Windows/macOS builds run in parallel with core_tests_ubuntu instead of
    # waiting for it. This avoids serializing the long Windows job behind the
    # Ubuntu core build.
    needs: [reduced_tests_ubuntu, no_onnx_tests_ubuntu, changes]
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ matrix.os }}
    # windows-latest gets +30 minutes over macOS. The amd64 Windows duration is
    # highly sensitive to sccache hit rate: when hits are high it can be close
    # to x86, but low-hit runs become much longer. Keep generous headroom for
    # that variance.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "macos-latest"]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 || true
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Disable OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CMAKE_ARGS=-DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON" >> "$env:GITHUB_ENV"

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Set up MSVC for Ninja (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      # sccache (set up above) caches compiled objects in GitHub Actions cache so
      # that repeated runs that do not touch C++ source are near-instant on both
      # Windows and macOS. This is especially effective for Windows where each
      # cold compilation takes ~24 minutes.
      - name: Build and Install package (Windows)
        if: runner.os == 'Windows'
        env:
          CMAKE_GENERATOR: Ninja
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -C build-dir=build -C cmake.build-type=Release -C cmake.define.ONNX_LIGHT_BUILD_TESTS=ON -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[dev] -v

      - name: Build and Install package (macOS)
        if: runner.os == 'macOS'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -C build-dir=build -C cmake.build-type=Release -C cmake.define.ONNX_LIGHT_BUILD_TESTS=ON -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[dev] -v

      - name: Install ONNX weekly
        run: pip uninstall -y onnx && pip install --upgrade onnx-weekly

      - name: pip freeze
        run: pip freeze

      - name: Run C++ unit tests (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build --output-on-failure -C Release --timeout 240

      - name: Run C++ unit tests (macOS)
        if: runner.os == 'macOS'
        run: ctest --test-dir build --output-on-failure -C Release --timeout 240

      # Surface the slowest C++ tests to help diagnose build/test slowness. Runs
      # even when the ctest step above fails (e.g. a per-test timeout) so the
      # offending long-running tests are still reported. CTest writes per-test
      # durations to Testing/Temporary/CTestCostData.txt as "name runs seconds".
      - name: Show longest C++ tests
        if: always()
        shell: bash
        run: |
          cost="build/Testing/Temporary/CTestCostData.txt"
          if [ -f "$cost" ]; then
            echo "Longest-running C++ tests (seconds):"
            # Diagnostic only: never fail the job. `head` closing the pipe early
            # can SIGPIPE the upstream commands, which trips bash's pipefail.
            grep -vE '^---' "$cost" | sort -k3 -nr | head -20 \
              | awk '{ printf "  %8.2f  %s\n", $3, $1 }' || true
          else
            echo "No CTest cost data found at $cost"
          fi

      - name: Run tests
        env:
          UNITTEST_GOING: "1"
        run: |
          pytest --durations=10 unittests

  windows_x86_build:
    name: core (windows-latest, x86 build)
    needs: [reduced_tests_ubuntu, no_onnx_tests_ubuntu, changes]
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    # Ninja honors the compiler launcher for MSVC, unlike the Visual Studio
    # platform generator previously used here. This lets the x86 build share
    # the same persistent sccache strategy as the x64 Windows build. The
    # sccache speedup only shows up once the cache is warm; the first (cold)
    # build after this change still pays the full compile cost, so keep the
    # same generous 60-minute timeout as the x64 Windows job to absorb that.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set up x86 MSVC for Ninja
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x86

      - name: Configure 32-bit CMake build
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake -S . -B build-win32 -G Ninja -DCMAKE_BUILD_TYPE=Release -DONNX_LIGHT_BUILD_PYTHON=OFF -DONNX_LIGHT_BUILD_TESTS=ON -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build 32-bit CMake build
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake --build build-win32 --parallel

      - name: Run C++ unit tests (32-bit)
        run: |
          ctest --test-dir build-win32 --output-on-failure --timeout 240
