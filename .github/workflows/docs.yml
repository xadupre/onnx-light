name: Documentation

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "**.md"
      - "**.rst"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "**.md"
      - "**.rst"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UNITTEST_GOING: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install doxygen
        run: sudo apt-get install -y doxygen
      - name: Set parallel build level
        shell: bash
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pip install -e ".[docs]"
      - name: Install ONNX weekly
        run: pip install --upgrade onnx-weekly
      - name: pip freeze
        run: pip freeze
      - name: Build documentation
        run: |
          warnings_file="$(mktemp)"
          set +e
          sphinx-build -b html docs dist/html -W -w "${warnings_file}"
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            exit 0
          fi
          python - <<'PY' "${warnings_file}"
          import pathlib
          import sys

          warnings_path = pathlib.Path(sys.argv[1])
          if not warnings_path.exists():
              print("Sphinx warnings file was not created; treating the failure as blocking.")
              sys.exit(1)
          with warnings_path.open(encoding="utf-8", errors="replace") as f:
              warning_lines = [
                  line.rstrip("\n")
                  for line in f
                  if ": WARNING:" in line or ": ERROR:" in line
              ]
          if not warning_lines:
              print("Sphinx failed without emitting warning lines; treating the failure as blocking.")
              sys.exit(1)
          if all("docs/operators/" in line for line in warning_lines):
              print(
                  "All Sphinx warnings are from generated operator docs "
                  "(docs/operators/*); treating them as non-blocking."
              )
              sys.exit(0)
          sys.exit(1)
          PY
