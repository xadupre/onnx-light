name: Update Pixi dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: latest
          run-install: false

      - name: Update OpenSSL and CMake
        run: pixi update --no-install cmake openssl

      - name: Create or update pull request
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: dependabot/pixi-cmake-openssl
        run: |
          if git diff --quiet -- pixi.lock; then
            echo "OpenSSL and CMake are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$PR_BRANCH"
          git add pixi.lock
          git commit -m "Update OpenSSL and CMake in pixi.lock"
          git push --force origin "HEAD:$PR_BRANCH"

          if gh pr view "$PR_BRANCH" >/dev/null 2>&1; then
            gh pr edit "$PR_BRANCH" \
              --title "Update OpenSSL and CMake in pixi.lock" \
              --body "Updates the Pixi lockfile entries for OpenSSL and CMake."
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$PR_BRANCH" \
              --title "Update OpenSSL and CMake in pixi.lock" \
              --body "Updates the Pixi lockfile entries for OpenSSL and CMake."
          fi
