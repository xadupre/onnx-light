name: ci-orchestrator

# Single-file CI pipeline that enforces a phased execution order by calling
# existing reusable workflow definitions via `uses:`.
#
#   Phase 1 – fast checks (clang-format, style, typing, spelling, CodeQL)
#              all run in parallel; any failure stops the pipeline.
#   Gate 1  – a lightweight job that blocks Phase 2 until Phase 1 is green.
#   Phase 2 – ci-1-core preflight and builds (reduced → no-onnx → heavy),
#              called as a single reusable workflow that enforces its own
#              internal ordering.
#   ci_pass – final job that succeeds only when every prior phase succeeds;
#              use this job as the single required PR status check.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Phase 1: fast checks ──────────────────────────────────────────────────────

jobs:
  fast_clang_format:
    name: fast / clang-format
    uses: ./.github/workflows/clang_format.yml

  fast_style:
    name: fast / style
    uses: ./.github/workflows/style.yml

  fast_typing:
    name: fast / typing
    uses: ./.github/workflows/typing.yml

  fast_spelling:
    name: fast / spelling
    uses: ./.github/workflows/spelling.yml

  fast_codeql:
    name: fast / codeql
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  # ── Gate 1: all fast checks must pass ────────────────────────────────────────

  fast_gate:
    name: fast gate
    needs: [fast_clang_format, fast_style, fast_typing, fast_spelling, fast_codeql]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "All fast checks passed."

  # ── Phase 2 + 3: core CI (preflight + heavy builds) ──────────────────────────
  #
  # ci-1-core enforces its own internal order:
  #   reduced_tests_ubuntu → no_onnx_tests_ubuntu → core_tests_ubuntu
  #                                                → core_tests (win/mac)
  #                                                → windows_x86_build

  call_ci_core:
    name: ci-1-core
    needs: [fast_gate]
    uses: ./.github/workflows/ci_core.yml

  # ── Final job: the single required PR status check ────────────────────────────
  #
  # ci_pass succeeds only when every phase above completes successfully.
  # Configure branch protection to require this job name as the mandatory
  # status check so that merging is gated on the entire pipeline.

  ci_pass:
    name: ci pass
    needs: [call_ci_core]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check all jobs succeeded
        env:
          CI_CORE: ${{ needs.call_ci_core.result }}
        run: |
          if [ "${CI_CORE}" != "success" ] && [ "${CI_CORE}" != "skipped" ]; then
            echo "CI core failed or was cancelled: ${CI_CORE}"
            exit 1
          fi
          echo "All phases passed. CI pipeline succeeded."
