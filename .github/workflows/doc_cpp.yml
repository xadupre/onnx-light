name: Doxygen

on:
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc_cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install doxygen
        run: sudo apt-get install -y doxygen
      - name: Generate C++ documentation
        working-directory: docs
        run: |
          mkdir -p ../dist/doxygen
          DOXYGEN_OUTPUT_DIR=$(pwd)/../dist/doxygen \
            doxygen - <<'EOF'
          @INCLUDE = Doxyfile
          GENERATE_HTML = YES
          GENERATE_XML = NO
          EOF
      - name: Upload C++ documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: cpp-docs
          path: dist/doxygen/html
          retention-days: 7

  report_failure:
    needs: doc_cpp
    if: ${{ failure() && needs.doc_cpp.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failed documentation run
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ github.workflow }} failed (run ${{ github.run_id }})
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          issue_count="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --search "${GITHUB_RUN_ID} in:title" --json number --jq 'length')"
          if [ "$issue_count" -eq 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body "The [documentation workflow run](${RUN_URL}) failed. See the run logs for details."
          fi
