name: fuzz

on:
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "onnx_light/fuzz/**"
      - ".github/workflows/fuzz.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz_smoke:
    name: fuzz smoke (ubuntu-latest, py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenSSL (Linux)
        run: sudo apt-get install -y libssl-dev clang

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"

      - name: Build and install package
        env:
          CC: clang
          CXX: clang++
        run: pip install -Cbuild-dir=build -e .[dev]

      - name: Install atheris
        env:
          CC: clang
          CXX: clang++
        run: pip install atheris

      - name: pip freeze
        run: pip freeze

      - name: Generate seed corpora
        run: |
          mkdir -p /tmp/fuzz_seeds
          python -m onnx_light.fuzz.make_seed_corpus \
            /tmp/fuzz_seeds/vc_seeds.zip \
            /tmp/fuzz_seeds/parser_seeds.zip \
            /tmp/fuzz_seeds/shape_inference_seeds.zip

      - name: Run fuzz_checker (smoke)
        run: python -m onnx_light.fuzz.fuzz_checker -runs=2000 -timeout=25

      - name: Run fuzz_model_loader (smoke)
        run: python -m onnx_light.fuzz.fuzz_model_loader -runs=2000 -timeout=25

      - name: Run fuzz_parser (smoke)
        run: python -m onnx_light.fuzz.fuzz_parser -runs=2000 -timeout=25

      - name: Run fuzz_shape_inference (smoke)
        run: python -m onnx_light.fuzz.fuzz_shape_inference -runs=2000 -timeout=25

      - name: Run fuzz_optim_shape_inference (smoke)
        run: python -m onnx_light.fuzz.fuzz_optim_shape_inference -runs=2000 -timeout=25

      - name: Run fuzz_version_converter (smoke)
        run: python -m onnx_light.fuzz.fuzz_version_converter -runs=2000 -timeout=25
