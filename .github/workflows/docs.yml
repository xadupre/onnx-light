name: Documentation

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "**.md"
      - "**.rst"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "**.md"
      - "**.rst"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UNITTEST_GOING: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install doxygen
        run: sudo apt-get install -y doxygen
      - name: Set parallel build level
        shell: bash
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pip install -e ".[docs]"
      - name: Install ONNX weekly
        run: pip install --upgrade onnx-weekly
      - name: pip freeze
        run: pip freeze
      - name: Build documentation
        run: |
          warnings_file="$(mktemp)"
          set +e
          sphinx-build -b html docs dist/html -W -w "${warnings_file}"
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            exit 0
          fi
          python - <<'PY' "${warnings_file}"
          import pathlib
          import sys

          warnings_path = pathlib.Path(sys.argv[1])
          warning_lines = [
              line
              for line in warnings_path.read_text(encoding="utf-8", errors="replace").splitlines()
              if ": WARNING:" in line or ": ERROR:" in line
          ]
          if warning_lines and all("docs/operators/" in line for line in warning_lines):
              print("Ignoring documentation warnings from docs/operators/*.")
              sys.exit(0)
          sys.exit(1)
          PY
