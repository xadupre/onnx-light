name: acq - asan-ubsan

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitizer_build_ubuntu:
    name: asan+ubsan (ubuntu-latest, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 47
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install OpenSSL and clang (Linux)
        run: sudo apt-get install -y libssl-dev clang

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Build and install package (Debug + ASan + UBSan)
        env:
          CC: clang
          CXX: clang++
          CXXFLAGS: -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
          LDFLAGS: -fsanitize=address,undefined
        run: pip install -C build-dir=build -C cmake.build-type=Debug -C cmake.define.ONNX_LIGHT_BUILD_TESTS=ON -e .[dev] -v

      - name: Install ONNX weekly
        run: pip uninstall -y onnx && pip install --upgrade onnx-weekly

      - name: pip freeze
        run: pip freeze

      - name: Run C++ unit tests
        env:
          # detect_container_overflow is off: protobuf and googletest are built
          # without instrumentation, so their containers lack the annotations ASan
          # expects and the check reports false positives.
          ASAN_OPTIONS: detect_leaks=1:strict_init_order=1:check_initialization_order=1:detect_container_overflow=0:alloc_dealloc_mismatch=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

      - name: Run Python unit tests
        env:
          # Python itself is not built with sanitizers, so leak detection
          # produces large amounts of false positives from CPython internals.
          # detect_container_overflow is off: CPython, protobuf and googletest are
          # built without instrumentation, so their containers lack the annotations
          # ASan expects and the check reports false positives.
          ASAN_OPTIONS: detect_leaks=0:strict_init_order=1:check_initialization_order=1:detect_container_overflow=0:alloc_dealloc_mismatch=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          # When loading sanitizer-instrumented .so files from a non-instrumented
          # interpreter, the sanitizer runtime must be preloaded, otherwise the
          # extension modules fail with undefined symbols such as
          # __ubsan_vptr_type_cache or __asan_init.
          ASAN_LIB=$(clang -print-file-name=libclang_rt.asan-x86_64.so)
          UBSAN_LIB=$(clang -print-file-name=libclang_rt.ubsan_standalone-x86_64.so)
          echo "ASAN_LIB=${ASAN_LIB}"
          echo "UBSAN_LIB=${UBSAN_LIB}"
          export LD_PRELOAD="${ASAN_LIB}:${UBSAN_LIB}"
          UNITTEST_GOING=1 pytest --durations=10 unittests -v
