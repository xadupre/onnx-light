name: ci-debug-ubuntu

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug_tests_ubuntu:
    name: debug unit tests (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and Install package (Debug)
        env:
          CXXFLAGS: -O0 -g
          LDFLAGS: ""
        run: pip install -Cbuild-dir=build -Ccmake.build-type=Debug -Ccmake.define.ONNX_LIGHT_BUILD_TESTS=ON -e .[dev]

      - name: Install ONNX weekly
        run: pip install --upgrade onnx-weekly

      - name: pip freeze
        run: pip freeze

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Run Python unit tests
        run: |
          pytest --durations=10 unittests -v
