name: Documentation

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      UNITTEST_GOING: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install doxygen
        run: sudo apt-get install -y doxygen
      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"
      - name: Install dependencies
        run: pip install -e ".[docs]" -v
      - name: Install ONNX weekly
        run: pip uninstall -y onnx && pip install --upgrade onnx-weekly
      - name: pip freeze
        run: pip freeze
      - name: Build documentation
        run: |
          warnings_file="$(mktemp)"
          set +e
          UNITTEST_GOING=1 sphinx-build -b html docs dist/html -W -w "${warnings_file}"
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            exit 0
          fi
          python - <<'PY' "${warnings_file}"
          import pathlib
          import re
          import sys

          warnings_path = pathlib.Path(sys.argv[1])
          if not warnings_path.exists():
              print("Sphinx warnings file was not created; treating the failure as blocking.")
              sys.exit(1)
          warning_pattern = re.compile(r": (?:WARNING|ERROR):")
          operator_warning = re.compile(r"(?:^|.*/)docs/operators/[^:]+:\d+: (?:WARNING|ERROR):")
          cpp_api_warning = re.compile(r"(?:^|.*/)docs/api/cpp/[^:]+:\d+: (?:WARNING|ERROR):")
          with warnings_path.open(encoding="utf-8", errors="replace") as f:
              warning_lines = [
                  line.rstrip()
                  for line in f
                  if warning_pattern.search(line)
              ]
          if not warning_lines:
              print("Sphinx failed without emitting warning lines; treating the failure as blocking.")
              sys.exit(1)
          if all(operator_warning.search(line) or cpp_api_warning.search(line) for line in warning_lines):
              print(
                  "All Sphinx warnings are from generated operator docs "
                  "(docs/operators/*) or C++ API docs (docs/api/cpp/*); "
                  "treating them as non-blocking."
              )
              sys.exit(0)
          sys.exit(1)
          PY

  report_failure:
    needs: docs
    if: ${{ failure() && needs.docs.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failed documentation run
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ github.workflow }} failed (run ${{ github.run_id }})
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          issue_count="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --search "${GITHUB_RUN_ID} in:title" --json number --jq 'length')"
          if [ "$issue_count" -eq 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body "The [documentation workflow run](${RUN_URL}) failed. See the run logs for details."
          fi
