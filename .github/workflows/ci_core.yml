name: ci-1-core

on:
  workflow_run:
    workflows: ["ci-debug-ubuntu"]
    types: [completed]

# Minimal read-only permissions for the GITHUB_TOKEN in every job that does
# not declare its own permissions block.  workflow_run workflows inherit the
# permissions of the default branch, so explicitly declaring read-only access
# here prevents accidental privilege escalation via checked-out PR code.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect doc-only changes
        id: filter
        shell: bash
        env:
          BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          HEAD_REF: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "${BASE_REF}" ]; then
            base_sha="${BASE_REF}"
          else
            base_sha="$(git rev-parse "${HEAD_REF}^" 2>/dev/null || echo '')"
          fi
          if [ -z "${base_sha}" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${base_sha}" "${HEAD_REF}")"
          echo "Changed files:"
          echo "${changed}"
          docs_only=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|*.md|*.rst) ;;
              *) docs_only=false ;;
            esac
          done <<< "${changed}"
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  reduced_tests_ubuntu:
    # Fastest preflight: builds onnx-light without the operator-kernel runtime
    # and backend-test registries (ONNX_LIGHT_BUILD_KERNELS=OFF). Must pass
    # before the no-onnx preflight (and therefore the heavier compilation jobs)
    # start. Kernel/backend tests skip themselves via
    # onnx_light.ext_test_case.import_or_skip, so the suite exercises the proto /
    # schema / shape-inference / manipulation layers that ship in the reduced
    # build. Mirrors .github/workflows/build_reduced_wheel.yml's configure flags.
    name: reduced (ubuntu-latest, py3.13)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install OpenSSL (Linux)
        run: sudo apt-get install -y libssl-dev

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Build and Install package without kernels/backend
        run: pip install -C build-dir=build -C cmake.define.ONNX_LIGHT_BUILD_KERNELS=OFF -e .[dev] -v

      - name: pip freeze
        run: pip freeze

      - name: Run tests (kernel/backend tests skip themselves)
        run: |
          UNITTEST_GOING=1 pytest --durations=10 unittests --ignore=unittests/onnxl_vs_onnx --ignore=unittests/onnxl_vs_ort

  no_onnx_tests_ubuntu:
    # Fast preflight: must pass before the heavier compilation jobs start.
    # Gated on the reduced (no kernels/backend) build so the smallest variant is
    # validated first. Mirrors .github/workflows/ci_no_onnx.yml but lives inside
    # ci-1-core so the gate is observable as a required PR status check.
    name: no-onnx (ubuntu-latest, py3.13)
    needs: [reduced_tests_ubuntu]
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install OpenSSL (Linux)
        run: sudo apt-get install -y libssl-dev

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Build and Install package
        run: pip install -Cbuild-dir=build -e .[dev] -v

      - name: uninstall onnx
        run: pip uninstall -y onnx

      - name: pip freeze
        run: pip freeze

      - name: Run tests (excluding onnxl_vs_onnx and onnxl_vs_ort)
        run: |
          UNITTEST_GOING=1 pytest --durations=10 unittests --ignore=unittests/onnxl_vs_onnx --ignore=unittests/onnxl_vs_ort

  core_tests_ubuntu:
    name: core (ubuntu-latest, py3.13)
    needs: [no_onnx_tests_ubuntu]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install OpenSSL (Linux)
        run: sudo apt-get install -y libssl-dev

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Build and Install package (Linux)
        run: pip install -C build-dir=build -C cmake.build-type=Release -C cmake.define.ONNX_LIGHT_BUILD_TESTS=ON -e .[dev] -v

      - name: Install ONNX weekly
        run: pip install --upgrade onnx-weekly

      - name: pip freeze
        run: pip freeze

      - name: Run C++ unit tests (Linux)
        run: ctest --test-dir build --output-on-failure

      - name: Run tests
        run: |
          UNITTEST_GOING=1 pytest --durations=10 unittests

  core_tests:
    name: core (${{ matrix.os }}, py${{ matrix.python-version }})
    # Gated only on the fast no-onnx preflight so the slow Windows/macOS builds
    # run in parallel with core_tests_ubuntu instead of waiting for it. This
    # avoids serializing the long Windows job behind the Ubuntu core build.
    needs: [no_onnx_tests_ubuntu, changes]
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 28
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "macos-latest"]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 || true
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Disable OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CMAKE_ARGS=-DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON" >> "$env:GITHUB_ENV"

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Build and Install package
        run: pip install -C build-dir=build -C cmake.build-type=Debug -C cmake.define.ONNX_LIGHT_BUILD_TESTS=ON -e .[dev] -v

      - name: Install ONNX weekly
        run: pip install --upgrade onnx-weekly

      - name: pip freeze
        run: pip freeze

      - name: Run C++ unit tests (macOS)
        if: runner.os == 'macOS'
        run: ctest --test-dir build --output-on-failure -C Debug --timeout 120

      - name: Run C++ unit tests (Windows, no OpenSSL)
        if: runner.os == 'Windows'
        run: ctest --test-dir build --output-on-failure -C Debug --timeout 120

      - name: Run tests
        env:
          UNITTEST_GOING: "1"
        run: |
          pytest --durations=10 unittests

  windows_x86_build:
    name: core (windows-latest, x86 build)
    needs: [no_onnx_tests_ubuntu, changes]
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configure 32-bit CMake build
        run: |
          cmake -S . -B build-win32 -A Win32 -DCMAKE_BUILD_TYPE=Release -DONNX_LIGHT_BUILD_PYTHON=OFF -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON

      - name: Build 32-bit CMake build
        run: |
          cmake --build build-win32 --config Release --parallel
