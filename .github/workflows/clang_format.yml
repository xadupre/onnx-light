name: clang-format

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang_format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check C++ formatting
        run: |
          find . -name "*.cpp" -name "*.cc" -o -name "*.h" -o -name "*.hpp" \
            | grep -v ".git" \
            | xargs clang-format --dry-run --Werror
