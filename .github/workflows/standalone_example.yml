name: Standalone example

on:
  workflow_run:
    workflows: ["ci-1-core"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  standalone_example:
    name: standalone example (ubuntu)
    # Only run if the required ci-1-core workflow (which itself gates on
    # no-onnx) completed successfully.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install onnx C++ library
        run: sudo apt-get install -y libonnx-dev libprotobuf-dev libssl-dev

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python3 -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Build standalone timing example
        run: bash examples/load_onnx_time/build.sh

      - name: Smoke-run standalone timing example
        run: |
          ./build/load-onnx-time-example/load_onnx_time \
            ./unittests/cc/onnx_proto/data/test_softmax_example_expanded.onnx 2

      - name: Build standalone load_onnx_light_time example
        run: |
          cmake -S . -B build/install-onnx-light-lib \
            -DCMAKE_BUILD_TYPE=Release \
            -DONNX_LIGHT_BUILD_PYTHON=OFF \
            -DONNX_LIGHT_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/build/install-onnx-light"
          cmake --build build/install-onnx-light-lib --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"
          cmake --install build/install-onnx-light-lib
          cmake -S examples/load_onnx_light_time -B build/load-onnx-light-time-example \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/install-onnx-light"
          cmake --build build/load-onnx-light-time-example --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Smoke-run standalone load_onnx_light_time example
        run: |
          ./build/load-onnx-light-time-example/load_onnx_light_time \
            ./unittests/cc/onnx_proto/data/test_softmax_example_expanded.onnx
