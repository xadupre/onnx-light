name: Build

on:
  workflow_run:
    workflows: ["ci-1-core"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changes
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Detect doc-only changes
        id: filter
        shell: bash
        run: |
          head_sha="${{ github.event.workflow_run.head_sha }}"
          base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || echo '')"
          if [ -z "${base_sha}" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${base_sha}" "${head_sha}")"
          echo "Changed files:"
          echo "${changed}"
          docs_only=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|*.md|*.rst) ;;
              *) docs_only=false ;;
            esac
          done <<< "${changed}"
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  build_wheels_ubuntu:
    name: wheels (ubuntu-latest)
    # Only run if the required ci-1-core workflow completed successfully.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect runner CPU count
        id: cpu_count
        shell: bash
        run: echo "count=$(python -c 'import os; print(os.cpu_count() or 1)')" >> "$GITHUB_OUTPUT"
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.2
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_ENVIRONMENT: >
            CMAKE_BUILD_PARALLEL_LEVEL=${{ steps.cpu_count.outputs.count }}
          CIBW_BEFORE_BUILD_LINUX: >
            yum install -y openssl-devel ||
            dnf install -y openssl-devel ||
            apt-get install -y libssl-dev ||
            true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: ./wheelhouse/*.whl

  build_wheels:
    name: wheels (${{ matrix.os }})
    needs: [build_wheels_ubuntu, changes]
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect runner CPU count
        id: cpu_count
        shell: bash
        run: echo "count=$(python -c 'import os; print(os.cpu_count() or 1)')" >> "$GITHUB_OUTPUT"
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.2
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ENVIRONMENT_MACOS: >
            CMAKE_BUILD_PARALLEL_LEVEL=${{ steps.cpu_count.outputs.count }}
            OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)
            CMAKE_ARGS=-DOPENSSL_USE_STATIC_LIBS=TRUE
          CIBW_ENVIRONMENT_WINDOWS: >
            CMAKE_BUILD_PARALLEL_LEVEL=${{ steps.cpu_count.outputs.count }}
            OPENSSL_ROOT_DIR="C:\\Program Files\\OpenSSL-Win64"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
