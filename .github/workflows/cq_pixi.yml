name: acq - pixi

on:
  schedule:
    # Run weekly on Mondays at 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/pixi.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixi_validate:
    name: pixi (${{ matrix.os }}, ${{ matrix.environment }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        environment: ["dev-no-onnx", "dev"]

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL (Linux)
        run: sudo apt-get install -y libssl-dev

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          environments: ${{ matrix.environment }}
          cache: true

      - name: Show pixi info
        run: pixi info

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"

      - name: Build and install package in pixi environment
        run: pixi run -e ${{ matrix.environment }} pip install --no-build-isolation -e .

      - name: pip freeze
        run: pixi run -e ${{ matrix.environment }} pip freeze

      - name: Run Python unit tests
        env:
          UNITTEST_GOING: "1"
        run: |
          pixi run -e ${{ matrix.environment }} pytest --durations=10 unittests --ignore=unittests/onnxl_vs_onnx --ignore=unittests/python/backend/test_backend_with_onnxruntime.py --ignore=unittests/python/bindings/test_save_with_onnxruntime.py
