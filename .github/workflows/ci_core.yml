name: ci-1-core

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core_tests_ubuntu:
    name: core (ubuntu-latest, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install OpenSSL (Linux)
        run: sudo apt-get install -y libssl-dev

      - name: Build and Install package (Linux with coverage)
        env:
          CXXFLAGS: --coverage -O0
          LDFLAGS: --coverage
        run: pip install -Cbuild-dir=build -Ccmake.build-type=Debug -Ccmake.define.ONNX_LIGHT_BUILD_TESTS=ON -e .[dev]

      - name: Install ONNX weekly
        run: pip install --upgrade onnx-weekly

      - name: Install gcovr
        run: pip install gcovr

      - name: pip freeze
        run: pip freeze

      - name: Run C++ unit tests (Linux with coverage)
        run: ctest --test-dir build --output-on-failure

      - name: Run tests
        run: |
          pytest --cov=onnx_light --cov-report=xml --durations=10 unittests

      - name: Export C++ coverage
        env:
          GCOVR_FILTER: ${{ github.workspace }}/onnx_light/.*\.cpp$
        run: |
          gcovr --root "${{ github.workspace }}" --gcov-ignore-errors source_not_found --filter "${GCOVR_FILTER}" --xml-pretty --output coverage-cpp.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml,./coverage-cpp.xml
          flags: core
          fail_ci_if_error: true

  core_tests:
    name: core (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: core_tests_ubuntu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "macos-latest"]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 || true
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Disable OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CMAKE_ARGS=-DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON" >> "$env:GITHUB_ENV"

      - name: Build and Install package
        run: pip install -Cbuild-dir=build -Ccmake.build-type=Debug -Ccmake.define.ONNX_LIGHT_BUILD_TESTS=ON -e .[dev]

      - name: Install ONNX weekly
        run: pip install --upgrade onnx-weekly

      - name: pip freeze
        run: pip freeze

      - name: Run C++ unit tests (macOS)
        if: runner.os == 'macOS'
        run: ctest --test-dir build --output-on-failure -C Debug --timeout 120

      - name: Run C++ unit tests (Windows, no OpenSSL)
        if: runner.os == 'Windows'
        run: ctest --test-dir build --output-on-failure -C Debug --timeout 120

      - name: Run tests
        run: |
          pytest --cov=onnx_light --cov-report=xml --durations=10 unittests

  windows_x86_build:
    name: core (windows-latest, x86 build)
    needs: core_tests_ubuntu
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure 32-bit CMake build
        run: |
          cmake -S . -B build-win32 -A Win32 -DCMAKE_BUILD_TYPE=Release -DONNX_LIGHT_BUILD_PYTHON=OFF -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON

      - name: Build 32-bit CMake build
        run: |
          cmake --build build-win32 --config Release --parallel
