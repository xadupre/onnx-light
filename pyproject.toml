[build-system]
requires = ["scikit-build-core>=0.3.3", "nanobind>=1.3.2", "numpy>=2.2"]
build-backend = "scikit_build_core.build"

[project]
name = "onnx-light"
version = "0.1.21"
description = "onnx without protobuf"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2",
    "ml-dtypes>=0.5.0",
]

[project.optional-dependencies]
style = [
    "black==26.5.1",
    "clang-format==22.1.8",
    "ruff==0.16.3",
]
typing = [
    "mypy==2.3.0",
    "pyrefly==1.2.0",
]
dev = [
    "onnx>=1.21.0",
    "onnxruntime",
    "onnx-light[dev-no-onnx]",
]
dev-no-onnx = [
    "onnx-light[style]",
    "matplotlib",
    "openpyxl",
    "pandas",
    "pytest>=7",
    "pytest-coverage",
    "pytest-subtests",
]
docs = [
    "onnx-light[style]",
    "breathe",
    "onnx-ir",
    "matplotlib",
    "onnx>=1.21.0",
    "onnxruntime",
    "openpyxl",
    "pandas",
    "pydata-sphinx-theme",
    "sphinx>=7",
    "sphinx-copybutton",
    "sphinx-datatables",
    "sphinx-design",
    "sphinx-gallery",
    "sphinx-issues",
    "myst-parser",
    "sphinx-runpython",
    "sphinxcontrib-mermaid",
]

[tool.scikit-build]
wheel.packages = ["onnx_light"]
sdist.include = ["sbom.cdx.json"]
# Keeps Release and MinSizeRel wheel artifacts free of static symbols. This is
# explicit rather than relying on scikit-build-core's build-type-dependent
# default so a backend upgrade cannot silently increase the installed size.
install.strip = true
# Build inside the project tree rather than the default system temporary
# directory. On Windows the temp directory is exposed through an 8.3 short
# path (e.g. C:\Users\RUNNER~1\AppData\Local\Temp\...), which makes MSBuild
# emit MSB8029 (output directory under the temp directory) and MSB8012
# (TargetPath vs OutputFile mismatch between the short and long path forms)
# and can break the wheel build. A stable build directory avoids both.
build-dir = "build/{wheel_tag}"

# Skip the C++ development install (static/import libraries, public headers and
# CMake package config) when building the Python wheel. Those files target
# downstream C++ consumers (who build via CMake, e.g. build_release_cpp.yml) and
# are dead weight inside a wheel: the shared libraries are duplicated (once in
# onnx_light/onnx_py/ for the runtime extensions and again under lib/ for the
# C++ install), and the headers/CMake configs are never used at import time.
# Dropping them roughly halves the wheel size on every platform, most visibly on
# Windows (extra import .lib files) and macOS (universal2 binaries are already
# twice as large). ONNX_LIGHT_INSTALL stays ON by default for plain CMake builds.
cmake.define.ONNX_LIGHT_INSTALL = "OFF"

# Tag the reduced wheel (built with ONNX_LIGHT_BUILD_KERNELS=OFF, i.e. without
# the operator-kernel runtime and the backend-test registries) so its file name
# differs from the full wheel. Setting ONNX_LIGHT_REDUCED=1 adds the "0reduced"
# build tag, producing e.g. onnx_light-0.1.2-0reduced-cp312-...whl instead of an
# identically named onnx_light-0.1.2-cp312-...whl. A wheel build tag must start
# with a digit (PEP 427), so it is "0reduced" rather than "reduced". The build
# tag is independent of the package version, so the wheel stays installable and
# the .dist-info directory name is unchanged.
[[tool.scikit-build.overrides]]
if.env.ONNX_LIGHT_REDUCED = "1"
wheel.build-tag = "0reduced"

[tool.pytest.ini_options]
testpaths = ["unittests"]

[tool.black]
line-length = 98
extend-exclude = '''.*clones*'''
skip-magic-trailing-comma = true

[tool.ruff]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".eggs",
    ".git",
    "build",
    "dist",
]

line-length = 98

[tool.ruff.lint]
# see https://docs.astral.sh/ruff/rules/
fixable = ["UP006", "UP035"]
unfixable = ["E731", "F401", "I001"]
select = [
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    #"D", # pydocstyle
    "E", # pycodestyle
    "F", # Pyflakes
    "G", # flake8-logging-format
    #"I", # isort
    "ISC", # flake8-implicit-str-concat
    "LOG", # flake8-logging
    #"N", # pep8-naming
    #"NPY", # modern numpy
    #"PERF", # Perflint
    "PIE", # flake8-pie
    "PYI", # flake8-pyi
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "SLOT", # flake8-slot
    "T10", # flake8-debugger
    #"TID", # Disallow relative imports
    #"TRY", # flake8-try-except-raise
    "UP", # pyupgrade
    "W", # pycodestyle
    "YTT", # flake8-2020
]

[tool.ruff.lint.extend-per-file-ignores]
"**" = [
    "B028", "B905",
    "C401", "C408", "C413",
    "PYI041",
    "RUF002", "RUF003", "RUF010", "RUF012", "RUF100",
    "SIM102", "SIM103", "SIM108", "SIM114", "SIM300", "SIM910",
    "UP006", "UP007", "UP015", "UP027", "UP031", "UP032", "UP034", "UP035", "UP037", "UP045",
]
"*/__init__.py" = ["F401"]
"docs/**" = ["B018", "E402", "RUF001", "SIM105"]
"unittests/**" = ["B023", "B904", "E731", "SIM300"]

[tool.mypy]
ignore_missing_imports = true

[tool.pyrefly]
project-includes = ["onnx_light/**/*.py"]
ignore-missing-imports = ["onnxruntime", "pandas", "matplotlib", "matplotlib.axes", "matplotlib.pyplot", "matplotlib.patches", "umap"]
