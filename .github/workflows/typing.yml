name: Typing

on:
  workflow_call:
  workflow_dispatch:

jobs:
  typing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install typing tools
        run: pip install numpy ml-dtypes onnx mypy==2.1.0 pyrefly==1.1.1
      - name: Run mypy
        run: mypy onnx_light
      - name: Run pyrefly
        run: pyrefly check
