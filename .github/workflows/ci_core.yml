name: ci-1-core

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core_tests:
    name: core (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        env:
          CXXFLAGS: --coverage -O0
          LDFLAGS: --coverage
        run: pip install -Cbuild-dir=build -e .[dev]

      - name: Install gcovr
        run: pip install gcovr

      - name: pip freeze
        run: pip freeze

      - name: Run tests
        run: |
          pytest --cov=onnx_light --cov-report=xml --durations=10 unittests

      - name: Export C++ coverage
        env:
          GCOVR_FILTER: ${{ github.workspace }}/onnx_light/.*\.cpp$
        run: |
          gcovr --root "${{ github.workspace }}" --gcov-ignore-errors source_not_found --filter "${GCOVR_FILTER}" --xml-pretty --output coverage-cpp.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml,./coverage-cpp.xml
          flags: core
