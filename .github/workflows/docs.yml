name: Documentation

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "onnx_light/doc.py"
      - "**.md"
      - "**.rst"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "onnx_light/doc.py"
      - "**.md"
      - "**.rst"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UNITTEST_GOING: "1"
      # Persist the ci_durations cache inside the repository under
      # ``cache_data/ci_durations_workflows`` so it can be reused across
      # documentation builds (see ``docs/ci_durations.rst``).  The commit
      # step at the end of this job pushes the refreshed cache back to
      # ``main``.  Only the official push-to-main run actually commits;
      # pull-request runs build the cache but never push.
      ONNX_LIGHT_DOCS_CACHE_IN_REPO: "1"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install doxygen
        run: sudo apt-get install -y doxygen
      - name: Set parallel build level
        shell: bash
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pip install -e ".[docs]"
      - name: Install ONNX weekly
        run: pip install --upgrade onnx-weekly
      - name: pip freeze
        run: pip freeze
      - name: Build documentation
        run: |
          warnings_file="$(mktemp)"
          set +e
          sphinx-build -b html docs dist/html -W -w "${warnings_file}"
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            exit 0
          fi
          python - <<'PY' "${warnings_file}"
          import pathlib
          import re
          import sys

          warnings_path = pathlib.Path(sys.argv[1])
          if not warnings_path.exists():
              print("Sphinx warnings file was not created; treating the failure as blocking.")
              sys.exit(1)
          warning_pattern = re.compile(r": (?:WARNING|ERROR):")
          operator_warning = re.compile(r"(?:^|.*/)docs/operators/[^:]+:\d+: (?:WARNING|ERROR):")
          cpp_api_warning = re.compile(r"(?:^|.*/)docs/api/cpp/[^:]+:\d+: (?:WARNING|ERROR):")
          with warnings_path.open(encoding="utf-8", errors="replace") as f:
              warning_lines = [
                  line.rstrip()
                  for line in f
                  if warning_pattern.search(line)
              ]
          if not warning_lines:
              print("Sphinx failed without emitting warning lines; treating the failure as blocking.")
              sys.exit(1)
          if all(operator_warning.search(line) or cpp_api_warning.search(line) for line in warning_lines):
              print(
                  "All Sphinx warnings are from generated operator docs "
                  "(docs/operators/*) or C++ API docs (docs/api/cpp/*); "
                  "treating them as non-blocking."
              )
              sys.exit(0)
          sys.exit(1)
          PY
      - name: Persist ci_durations cache
        # Only push the refreshed cache on the official push-to-main run
        # (pull-request builds, including those from forks, never write
        # back to the repository).  The cache lives under ``cache_data/``
        # and is populated by ``docs/ci_durations.rst`` when
        # ``ONNX_LIGHT_DOCS_CACHE_IN_REPO=1`` (set above).  On subsequent
        # runs the checked-in CSVs are picked up by ``_load_cached_runs``
        # in ``docs/ci_durations.rst`` so the page can render even when
        # the GitHub REST API is rate-limited or unreachable.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -d cache_data ]; then
            echo "No cache_data/ directory to persist; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache_data
          if git diff --cached --quiet; then
            echo "cache_data/ unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "docs: refresh ci_durations cache [skip ci]"
          # Retry the push a few times to mitigate races with other
          # commits landing on main between fetch and push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing on origin/main and retrying."
            git fetch origin main
            git rebase origin/main || {
              echo "::warning::Rebase on origin/main failed (likely conflicts in cache_data/); aborting rebase and skipping cache push."
              git rebase --abort
              exit 0
            }
          done
          echo "::warning::Failed to push cache_data/ after 3 attempts; giving up without failing the build."
          exit 0
