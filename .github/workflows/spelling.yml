name: Spelling

on:
  workflow_call:
  workflow_dispatch:

jobs:
  spelling:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install codespell
        run: pip install codespell==2.4.2
      - name: Check spelling
        run: codespell .
