name: Typing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install typing tools
        run: |
          pip install numpy ml-dtypes onnx
          pip install $(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          print(' '.join(d['project']['optional-dependencies']['typing']))
          ")
      - name: Run mypy
        run: mypy onnx_light
      - name: Run pyrefly
        run: pyrefly check
