[workspace]
name = "onnx-light"
description = "onnx without protobuf"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

# Conda-only environment (no PyPI mapping required) providing the
# build/runtime/dev/docs dependencies declared in pyproject.toml.
# After running `pixi install`, build/install the package itself with:
#     pixi run pip install --no-build-isolation -e .

[dependencies]
python = ">=3.10"
numpy = ">=2.1"
ml_dtypes = "*"
cmake = ">=3.27"
ninja = "*"
cxx-compiler = "*"
scikit-build-core = ">=0.3.3"
nanobind = ">=1.3.2"
pip = "*"

[feature.dev-no-onnx.dependencies]
black = "*"
matplotlib-base = "*"
pandas = "*"
pytest = ">=7"
pytest-cov = "*"
pytest-subtests = "*"
ruff = "*"

[feature.dev-onnx.dependencies]
onnx = ">=1.17"
onnxruntime = "*"

[feature.docs.dependencies]
black = "*"
breathe = "*"
matplotlib-base = "*"
onnx = ">=1.17"
onnxruntime = "*"
pandas = "*"
pydata-sphinx-theme = "*"
sphinx = ">=7"
sphinx-copybutton = "*"
sphinx-design = "*"
sphinx-gallery = "*"
sphinx-issues = "*"
sphinxcontrib-mermaid = "*"

[environments]
default = { solve-group = "default" }
dev-no-onnx = { features = ["dev-no-onnx"], solve-group = "default" }
dev = { features = ["dev-no-onnx", "dev-onnx"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
